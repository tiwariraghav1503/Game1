<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wheel Runner</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d17;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*900/420));aspect-ratio:900/420;container-type:size;background:#000;box-shadow:0 0 40px #000a}
  canvas#game{width:100%;height:100%;display:block}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5cqw;background:rgba(5,7,20,.72);backdrop-filter:blur(2px)}
  #overlay.hidden{display:none}
  #wheel{height:88cqh;aspect-ratio:1;max-width:46cqw}
  #panel{display:flex;flex-direction:column;align-items:flex-start;gap:2.4cqh;max-width:38cqw}
  #ptitle{margin:0;font-size:9cqh;line-height:1;letter-spacing:.02em;text-shadow:0 .5cqh 0 #0006}
  #ptext{margin:0;font-size:4.4cqh;line-height:1.3;opacity:.9}
  #result{margin:0;font-size:6cqh;font-weight:800;min-height:7cqh}
  #btn{font:inherit;font-weight:800;font-size:5.5cqh;padding:1.6cqh 4cqh;border:0;border-radius:99px;background:linear-gradient(#ffd23f,#ff9f1c);color:#2b1700;cursor:pointer;box-shadow:0 .8cqh 0 #b36b00;transition:transform .08s}
  #btn:active{transform:translateY(.6cqh);box-shadow:0 .2cqh 0 #b36b00}
  #btn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
  #fire{position:absolute;right:3cqw;bottom:6cqh;width:15cqh;height:15cqh;border-radius:50%;border:0;background:radial-gradient(#7ff,#09a);color:#012;font:800 3.4cqh system-ui;box-shadow:0 .8cqh 0 #056,0 0 3cqh #0cf8;opacity:.8;touch-action:none}
  #swap{position:absolute;right:21cqh;bottom:6cqh;width:10cqh;height:10cqh;border-radius:50%;border:0;background:#ffd23f;color:#2b1700;font:800 2.6cqh system-ui;box-shadow:0 .6cqh 0 #b36b00;opacity:.85;touch-action:none}
  #fire:active{transform:translateY(.6cqh)}
  #btns{display:flex;gap:2cqw;align-items:center}
  #shopBtn{font:inherit;font-weight:800;font-size:4.4cqh;padding:1.6cqh 3cqh;border:0;border-radius:99px;background:linear-gradient(#6ef0ff,#16a6d9);color:#032031;cursor:pointer;box-shadow:0 .8cqh 0 #0b6a8f}
  #shopBtn:active{transform:translateY(.6cqh);box-shadow:0 .2cqh 0 #0b6a8f}
  #shopBtn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
  #shop{position:absolute;inset:0;display:flex;flex-direction:column;gap:2cqh;padding:3cqh 4cqw;box-sizing:border-box;background:rgba(6,8,22,.95)}
  #shop.hidden{display:none}
  #shophead{display:flex;align-items:center;gap:3cqw}
  #shophead h2{margin:0;font-size:8cqh;line-height:1}
  #gemcount{font-size:5cqh;font-weight:800;color:#6ef0ff;flex:1}
  #shopclose{font:inherit;font-weight:800;font-size:4.4cqh;padding:1.2cqh 3cqh;border:0;border-radius:99px;background:#ffd23f;color:#2b1700;cursor:pointer}
  #items{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqh 2cqw;flex:1;min-height:0}
  .card{background:#1a1f38;border-radius:2cqh;padding:1.6cqh 1.8cqw;display:flex;flex-direction:column;gap:.6cqh;min-height:0;min-width:0}
  .card .ic{font-size:6cqh;line-height:1}
  .card .tp{font-size:2.6cqh;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
  .card b{font-size:4cqh}
  .card small{font-size:3cqh;opacity:.8;line-height:1.2;flex:1}
  .card button{font:inherit;font-weight:800;font-size:3.6cqh;padding:1cqh 0;border:0;border-radius:1.4cqh;background:#6ef0ff;color:#032031;cursor:pointer}
  .card button:disabled{background:#303652;color:#8a93b5;cursor:default}
  .card.owned button{background:#2f7d4b;color:#d8ffe6}
  #keys{font-size:3.2cqh;opacity:.6}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="900" height="420"></canvas>
    <button id="fire" aria-label="Fire">FIRE</button>
    <button id="swap" aria-label="Switch weapon">SWAP</button>
    <div id="overlay">
      <canvas id="wheel" width="560" height="560"></canvas>
      <div id="panel">
        <h1 id="ptitle">WHEEL RUNNER</h1>
        <p id="ptext"></p>
        <p id="result"></p>
        <div id="btns"><button id="btn">SPIN</button><button id="shopBtn">SHOP 💎</button></div>
        <div id="keys">Space / ↑ = jump &nbsp;·&nbsp; ↓ = slide &nbsp;·&nbsp; F / X = attack &nbsp;·&nbsp; Q or 1-4 = switch weapon &nbsp;·&nbsp; touch: tap top = jump, hold bottom = slide, FIRE / SWAP buttons</div>
      </div>
    </div>
    <div id="shop" class="hidden">
      <div id="shophead"><h2>SHOP</h2><span id="gemcount"></span><button id="shopclose">BACK</button></div>
      <div id="items"></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 900, H = 420, GROUND = 340;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const wcv = document.getElementById('wheel'), wctx = wcv.getContext('2d');
const overlay = document.getElementById('overlay');
const $shop = document.getElementById('shop'), $shopBtn = document.getElementById('shopBtn');
const $title = document.getElementById('ptitle'), $text = document.getElementById('ptext');
const $result = document.getElementById('result'), $btn = document.getElementById('btn');

// ---------------------------------------------------------------- levels
// The wheel picks one of these. Each changes theme, speed, gravity and hazards.
const LEVELS = [
  {name:'Meadow',  icon:'🌿', wheel:'#4caf50', sky:['#7cc8ff','#e6f7ff'], ground:'#58b85c', dirt:'#6d4c41', bg:'hills',     far:'#8fd18f', speed:6,   g:.8,  jv:-15,  ground_:['rock','crate'],     air:'bird',  airP:.22, mult:1, text:'Easy jog. Warm up.'},
  {name:'Desert',  icon:'🏜️', wheel:'#e0a030', sky:['#ffd27f','#fff3d1'], ground:'#e6bd6a', dirt:'#b9894a', bg:'dunes',     far:'#efc57c', speed:7,   g:.8,  jv:-15,  ground_:['cactus','rock'],    air:'bird',  airP:.25, mult:1, text:'Cacti everywhere.'},
  {name:'Snow',    icon:'❄️', wheel:'#6ec6ff', sky:['#b6d6ee','#f6fcff'], ground:'#f3faff', dirt:'#9fb8c9', bg:'mountains', far:'#c3d4e4', speed:7,   g:.8,  jv:-15,  ground_:['crystal','rock'],   air:'bird',  airP:.25, mult:1, text:'Ice spikes ahead.', snow:true},
  {name:'Moon',    icon:'🌙', wheel:'#8e8ce6', sky:['#04050e','#1c2040'], ground:'#9c9cab', dirt:'#5f5f70', bg:'stars',     far:'#2a2f5a', speed:8,   g:.38, jv:-11,  ground_:['tallrock','spire','alien','tallrock'], air:'ufo', airP:.42, gapX:[6,24], mult:1, text:'Low gravity. Tall rocks, aliens, UFOs, meteors.'},
  {name:'Lava',    icon:'🔥', wheel:'#ff5a36', sky:['#380808','#b3320c'], ground:'#3b2a2a', dirt:'#ff5a1f', bg:'volcano',   far:'#5a1a12', speed:8.5, g:.85, jv:-15.5,ground_:['fire','rock'],      air:'ember', airP:.3,  mult:1, text:'Hot. Fast. Don\'t touch.'},
  {name:'City',    icon:'🌃', wheel:'#b05cff', sky:['#0b0f33','#41306e'], ground:'#2c3047', dirt:'#1c1f31', bg:'city',      far:'#1b1d44', speed:8,   g:.8,  jv:-15,  ground_:['crate','rock'],     air:'drone', airP:.3,  mult:1, text:'Night run. Watch the drones.'},
  {name:'Storm',   icon:'⛈️', wheel:'#5a7a99', sky:['#1c2229','#4c5865'], ground:'#3a4a3b', dirt:'#252e26', bg:'storm',     far:'#303a44', speed:9,   g:.8,  jv:-15,  ground_:['rock','cactus','crate'], air:'bird', airP:.3, mult:1, text:'Thunder and chaos.'},
  {name:'Jungle',  icon:'🌴', wheel:'#2e9e5b', sky:['#5fc98a','#e4ffd6'], ground:'#2f8f46', dirt:'#5a3a22', bg:'jungle',    far:'#2f8f4f', speed:7.5, g:.8,  jv:-15,  ground_:['log','snake','hopper','rock'], air:'bat', airP:.28, hiAir:1, wob:10, hop:'frog', mult:1, text:'Logs, snakes and hopping frogs.'},
  {name:'Graveyard',icon:'👻', wheel:'#6b4ea3', sky:['#150f2c','#4d3a70'], ground:'#2b2b38', dirt:'#16161f', bg:'graveyard', far:'#2a2146', speed:8,   g:.8,  jv:-15,  ground_:['tomb','zombie','spikes'],     air:'ghost', airP:.35, hiAir:1, wob:14, mult:1, text:'Zombies rise. Ghosts float.'},
  {name:'Candy',   icon:'🍭', wheel:'#ff6fb5', sky:['#ffbde0','#fff1fa'], ground:'#ff8fc7', dirt:'#c2549a', bg:'candy',     far:'#ffa6d6', speed:8,   g:.8,  jv:-15,  ground_:['cane','hopper','crate'],      air:'bee',   airP:.3,  hiAir:1, wob:12, hop:'gummy', mult:1, text:'Sweet, but it bites.'},
  {name:'Reef',    icon:'🌊', wheel:'#1fa3c9', sky:['#0a5a8c','#74dbe9'], ground:'#e8d49a', dirt:'#b09a5c', bg:'reef',      far:'#2a8db3', speed:7.5, g:.5,  jv:-12,  ground_:['coral','urchin','crab'],      air:'jelly', airP:.33, hiAir:1, wob:16, mult:1, text:'Underwater drift. Crabs scuttle fast.'},
  {name:'Turbo',   icon:'⚡', wheel:'#ff3d9a', sky:['#1a0033','#ff2d95'], ground:'#1b1b2f', dirt:'#0f0f1c', bg:'stripes',   far:'#4d0a60', speed:11,  g:.8,  jv:-15,  ground_:['crystal','crate'],  air:'drone', airP:.3,  mult:2, text:'Maximum speed. Double points!'},
];
const LEVEL_FRAMES = 60 * 24;   // ~24 s per wheel spin

// ---------------------------------------------------------------- audio
let actx = null;
function beep(f, d = .08, type = 'square', vol = .05, slide = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), actx.currentTime + d);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

// ---------------------------------------------------------------- state
let state = 'title';       // title | spinning | play | wheel | over
let level = LEVELS[0], levelIdx = 0;
let best = 0;
try { best = +localStorage.getItem('wheelrunner.best') || 0; } catch (e) {}

// weapons: the gun is ranged and uses ammo; the rest are melee swings with a reach and a height band above the feet
const WEAPONS = [
  {id:'gun',   name:'Blaster', icon:'🔫'},
  {id:'sword', name:'Sword',   icon:'🗡️', range:80,  band:[10, 80], dur:10, cd:24, dmg:2, breaks:true},
  {id:'stick', name:'Stick',   icon:'🦯', range:58,  band:[0, 38],  dur:7,  cd:11, dmg:1},
  {id:'chain', name:'Chain',   icon:'⛓️', range:150, band:[6, 72],  dur:16, cd:34, dmg:1},
];
const SOFT = new Set(['crate', 'barrel', 'log', 'cactus', 'cane', 'coral']);   // the sword can chop these
let weapon = 0, atkId = 0, toast = 0;
let bullets, ammo, ammoT, fireCD;
const MAX_AMMO = 6, AMMO_REGEN = 55;
// ---------------------------------------------------------------- save + gear
let save = {gems:0, owned:{}};
try { const j = JSON.parse(localStorage.getItem('wheelrunner.save') || 'null'); if (j) save = {gems:+j.gems || 0, owned:j.owned || {}}; } catch (e) {}
const persist = () => { try { localStorage.setItem('wheelrunner.save', JSON.stringify(save)); } catch (e) {} };
const has = id => !!save.owned[id];
const ARMOR_VAL = {helmet:1, vest:2, boots:1};
const armorMax = () => Object.keys(ARMOR_VAL).reduce((n, k) => n + (has(k) ? ARMOR_VAL[k] : 0), 0);
const ownsWeapon = w => w.id === 'gun' || w.id === 'stick' || has(w.id);
const SHOP = [
  {id:'sword',  type:'Weapon', icon:'🗡️', name:'Sword',  cost:25, desc:'Strong swing. Chops crates, barrels and cacti.'},
  {id:'chain',  type:'Weapon', icon:'⛓️', name:'Chain',  cost:40, desc:'Long whip that hits at every height.'},
  {id:'helmet', type:'Armor',  icon:'⛑️', name:'Helmet', cost:15, desc:'Absorbs 1 crash each run.'},
  {id:'vest',   type:'Armor',  icon:'🦺', name:'Vest',   cost:30, desc:'Absorbs 2 crashes each run.'},
  {id:'boots',  type:'Armor',  icon:'🥾', name:'Boots',  cost:20, desc:'Absorbs 1 crash each run.'},
  {id:'magnet', type:'Gear',   icon:'🧲', name:'Magnet', cost:25, desc:'Pulls nearby diamonds to you.'},
];
let gems, runGems, armor, gemLeft, toastMsg = '';
let player, obstacles, particles, dist, score, scoreAcc, levelTime, levelsDone, spawnLeft, speed, shake, flash, clock = 0;
const keys = {down:false};
let touchDown = false;

function resetGame() {
  player = {inv:0, atk:null, x:130, y:GROUND, vy:0, onGround:true, sliding:false, phase:0, dead:false};
  obstacles = []; particles = []; bullets = []; gems = []; runGems = 0; armor = armorMax(); gemLeft = 500; ammo = MAX_AMMO; ammoT = 0; fireCD = 0;
  dist = 0; score = 0; scoreAcc = 0; levelTime = 0; levelsDone = 0; shake = 0; flash = 0;
  spawnLeft = 600; speed = 6;
}
resetGame();

// ---------------------------------------------------------------- wheel
const N = LEVELS.length, SEG = Math.PI * 2 / N;
let wheelRot = -Math.PI / 2 - SEG * .5, wheelWin = -1;

function drawWheel() {
  const s = wcv.width, c = s / 2, R = c - 26;
  wctx.clearRect(0, 0, s, s);
  wctx.save(); wctx.translate(c, c);
  // outer rim with bulbs
  wctx.beginPath(); wctx.arc(0, 0, R + 18, 0, 7); wctx.fillStyle = '#2a2140'; wctx.fill();
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2, on = ((i + Math.floor(clock / 8)) % 2) === 0;
    wctx.beginPath(); wctx.arc(Math.cos(a) * (R + 9), Math.sin(a) * (R + 9), 4.5, 0, 7);
    wctx.fillStyle = on ? '#ffe27a' : '#8a6f1d'; wctx.fill();
  }
  for (let i = 0; i < N; i++) {
    const a0 = wheelRot + i * SEG, a1 = a0 + SEG;
    wctx.beginPath(); wctx.moveTo(0, 0); wctx.arc(0, 0, R, a0, a1); wctx.closePath();
    wctx.fillStyle = LEVELS[i].wheel; wctx.fill();
    wctx.fillStyle = (i % 2) ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.06)'; wctx.fill();
    wctx.lineWidth = 3; wctx.strokeStyle = 'rgba(0,0,0,.35)'; wctx.stroke();
    // label
    wctx.save(); wctx.rotate(a0 + SEG / 2);
    wctx.textAlign = 'right'; wctx.textBaseline = 'middle';
    wctx.font = '30px system-ui,"Apple Color Emoji","Segoe UI Emoji"'; wctx.fillStyle = '#fff';
    wctx.fillText(LEVELS[i].icon, R - 14, 0);
    wctx.font = '800 21px system-ui,sans-serif'; wctx.lineWidth = 5; wctx.strokeStyle = 'rgba(0,0,0,.55)';
    wctx.strokeText(LEVELS[i].name.toUpperCase(), R - 62, 1); wctx.fillText(LEVELS[i].name.toUpperCase(), R - 62, 1);
    wctx.restore();
  }
  if (wheelWin >= 0 && state !== 'spinning') {          // highlight the winner
    const a0 = wheelRot + wheelWin * SEG;
    wctx.beginPath(); wctx.moveTo(0, 0); wctx.arc(0, 0, R - 2, a0, a0 + SEG); wctx.closePath();
    wctx.lineWidth = 7; wctx.strokeStyle = '#fff'; wctx.stroke();
  }
  // hub
  wctx.beginPath(); wctx.arc(0, 0, 34, 0, 7); wctx.fillStyle = '#ffd23f'; wctx.fill();
  wctx.lineWidth = 6; wctx.strokeStyle = '#2a2140'; wctx.stroke();
  wctx.fillStyle = '#2a2140'; wctx.font = '800 22px system-ui'; wctx.textAlign = 'center'; wctx.textBaseline = 'middle'; wctx.fillText('SPIN', 0, 1);
  wctx.restore();
  // pointer (top)
  wctx.beginPath(); wctx.moveTo(c - 20, 2); wctx.lineTo(c + 20, 2); wctx.lineTo(c, 50); wctx.closePath();
  wctx.fillStyle = '#ff2e4d'; wctx.fill(); wctx.lineWidth = 5; wctx.strokeStyle = '#fff'; wctx.stroke();
}

const ease = t => 1 - Math.pow(1 - t, 4);
function spinWheel() {
  if (state === 'spinning') return;
  state = 'spinning'; $btn.disabled = true; $shopBtn.disabled = true; $result.textContent = ''; wheelWin = -1;
  beep(300, .15, 'sawtooth', .04, 400);
  const idx = Math.floor(Math.random() * N);
  const jitter = (Math.random() - .5) * SEG * .7;
  const finalBase = -Math.PI / 2 - (idx + .5) * SEG + jitter;
  const TAU = Math.PI * 2;
  const start = wheelRot;
  const delta = (((finalBase - start) % TAU) + TAU) % TAU + TAU * (5 + Math.floor(Math.random() * 3));
  const dur = 4200, t0 = performance.now();
  let lastTick = Math.floor(start / SEG);
  (function step(now) {
    const t = Math.min(1, (now - t0) / dur);
    wheelRot = start + delta * ease(t);
    const tick = Math.floor(wheelRot / SEG);
    if (tick !== lastTick) { lastTick = tick; beep(700 + (t * 200), .03, 'triangle', .05); }
    if (t < 1) return requestAnimationFrame(step);
    wheelWin = idx; levelIdx = idx; level = LEVELS[idx];
    state = 'landing';
    $result.textContent = level.icon + ' ' + level.name;
    $text.textContent = level.text;
    beep(520, .12, 'square', .06); setTimeout(() => beep(780, .2, 'square', .06), 120);
    setTimeout(startLevel, 1700);
  })(t0);
}

function startLevel() {
  overlay.classList.add('hidden');
  obstacles = []; bullets = []; ammo = MAX_AMMO; levelTime = 0; spawnLeft = 650; player.y = GROUND; player.vy = 0; player.onGround = true;
  state = 'play';
}

function showOverlay(title, text, btn) {
  $title.textContent = title; $text.textContent = text; $btn.textContent = btn; $btn.disabled = false; $shopBtn.disabled = false;
  $result.textContent = ''; wheelWin = -1;
  overlay.classList.remove('hidden');
}

// ---------------------------------------------------------------- input
function jump() {
  if (state !== 'play' || player.dead) return;
  if (player.onGround) {
    player.vy = level.jv; player.onGround = false; player.sliding = false;
    beep(380, .12, 'square', .04, 260); dust(player.x, GROUND, 4);
  }
}
function setWeapon(i) {
  if (i === weapon) return;
  if (!ownsWeapon(WEAPONS[i])) { toast = 70; toastMsg = WEAPONS[i].name + ' locked - buy in shop'; beep(120, .08, 'square', .04); return; }
  weapon = i; player.atk = null; toast = 70; toastMsg = WEAPONS[i].name; beep(520, .05, 'triangle', .05);
}
function nextWeapon() { for (let k = 1; k <= WEAPONS.length; k++) { const i = (weapon + k) % WEAPONS.length; if (ownsWeapon(WEAPONS[i])) return setWeapon(i); } }
function attack() {
  if (state !== 'play' || player.dead || fireCD > 0) return;
  if (weapon === 0) return shoot();
  const w = WEAPONS[weapon];
  fireCD = w.cd; player.atk = {w, t:0, id:++atkId};
  beep(w.id === 'chain' ? 160 : 260, .09, 'sawtooth', .04, 220);
}
function killEnemy(o) {
  o.dead = true; scoreAcc += 50 * level.mult; ammo = Math.min(MAX_AMMO, ammo + 1);
  dust(o.x + o.w / 2, o.y - o.h / 2, 14, 'rgba(255,230,120,.95)'); beep(240, .14, 'sawtooth', .05, 200);
}
function shoot() {
  if (ammo <= 0) { beep(120, .05, 'square', .03); return; }
  ammo--; fireCD = 10; player.flash = 6;
  const low = player.sliding && player.onGround;
  bullets.push({x:player.x + 32, px:player.x + 32, y:player.y - (low ? 14 : 38), vx:15});
  beep(900, .07, 'square', .04, -500);
}
function isEnemy(o) { return o.kind === 'air' || o.kind === 'meteor' || o.kind in ENEMY_VX; }
function wantsSlide() { return keys.down || touchDown; }
function primary() {
  if (!$shop.classList.contains('hidden')) return;
  if (state === 'title') { resetGame(); spinWheel(); }
  else if (state === 'wheel') spinWheel();
  else if (state === 'over') { resetGame(); levelIdx = 0; spinWheel(); }
}
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','Enter'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { state === 'play' ? jump() : primary(); }
  else if (e.code === 'KeyF' || e.code === 'KeyX' || e.code === 'KeyZ') attack();
  else if (e.code === 'KeyQ') nextWeapon();
  else if (/^Digit[1-4]$/.test(e.code)) setWeapon(+e.code.slice(5) - 1);
  else if (e.code === 'Enter') primary();
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
  if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && player.vy < -5) player.vy *= .5;   // short hop
});
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { primary(); return; }
  const r = cv.getBoundingClientRect();
  if ((e.clientY - r.top) / r.height > .6) touchDown = true; else jump();
});
addEventListener('pointerup', () => touchDown = false);
addEventListener('pointercancel', () => touchDown = false);
const $fire = document.getElementById('fire');
$fire.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); attack(); });
document.getElementById('swap').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); nextWeapon(); });
$btn.addEventListener('click', primary);
wcv.addEventListener('click', primary);

// ---------------------------------------------------------------- shop
const $items = document.getElementById('items');
function renderShop() {
  document.getElementById('gemcount').textContent = '💎 ' + save.gems;
  $items.innerHTML = SHOP.map(it => {
    const owned = has(it.id), ok = save.gems >= it.cost;
    return '<div class="card' + (owned ? ' owned' : '') + '"><span class="ic">' + it.icon + '</span><span class="tp">' + it.type + '</span><b>' + it.name + '</b><small>' + it.desc +
      '</small><button data-id="' + it.id + '"' + (owned || !ok ? ' disabled' : '') + '>' + (owned ? 'OWNED' : 'BUY 💎 ' + it.cost) + '</button></div>';
  }).join('');
}
function openShop() { if ($shopBtn.disabled) return; renderShop(); $shop.classList.remove('hidden'); }
function closeShop() { $shop.classList.add('hidden'); }
$shopBtn.addEventListener('click', openShop);
document.getElementById('shopclose').addEventListener('click', closeShop);
addEventListener('keydown', e => { if (e.code === 'Escape') closeShop(); });
$items.addEventListener('click', e => {
  const id = e.target.dataset && e.target.dataset.id; if (!id) return;
  const it = SHOP.find(i => i.id === id);
  if (!it || has(id) || save.gems < it.cost) return;
  save.gems -= it.cost; save.owned[id] = 1; persist();
  if (ARMOR_VAL[id] && state === 'wheel') armor += ARMOR_VAL[id];     // bought mid-run: put it on straight away
  beep(660, .1, 'square', .06); setTimeout(() => beep(990, .15, 'square', .06), 90);
  renderShop();
});

// ---------------------------------------------------------------- gems
function gemArc(x0, w, topY) {
  const n = 5;
  for (let i = 0; i < n; i++) gems.push({x:x0 - 8 + i * (w + 36) / (n - 1), y:Math.max(GROUND - 126, topY - 22 - Math.sin(Math.PI * i / (n - 1)) * 30), t:Math.random() * 9, v:1});
}
function gemRow() {
  const r = Math.random(), x0 = W + 40, big = Math.random() < .12;
  if (r < .4) for (let i = 0; i < 6; i++) gems.push({x:x0 + i * 34, y:GROUND - 24, t:i, v:1});
  else if (r < .7) for (let i = 0; i < 5; i++) gems.push({x:x0 + i * 34, y:GROUND - 96, t:i, v:1});
  else for (let i = 0; i < 8; i++) gems.push({x:x0 + i * 32, y:GROUND - 66 - Math.sin(i * .8) * 34, t:i, v:1});
  if (big) { const g = gems[gems.length - 1 - Math.floor(Math.random() * 4)]; g.v = 5; }
}

// ---------------------------------------------------------------- obstacles
const SIZES = {rock:[44,34], crate:[46,46], cactus:[30,64], fire:[38,72], crystal:[36,58], tallrock:[50,98], spire:[40,112], alien:[38,58], log:[66,30], spikes:[58,24], tomb:[42,62], barrel:[38,46], cane:[30,74], coral:[42,58], urchin:[36,36], zombie:[36,66], snake:[54,22], crab:[44,28], hopper:[38,38]};
const ENEMY_VX = {alien:2.6, zombie:2, snake:1.8, crab:3.2, hopper:1.6};
function spawn() {
  const air = Math.random() < level.airP;
  if (air && level.air === 'ufo') {
    const r = Math.random();
    if (r < .35) {            // meteor: falls from the sky and lands ahead of the runner
      const lx = 170 + Math.random() * 140, f = (W + 30 - lx) / speed;
      obstacles.push({kind:'meteor', x:W + 30, y:-30, w:34, h:34, vy:(GROUND + 12) / f, t:0});
    } else if (r < .7) {      // high UFO: punishes big jumps, you must hop low or wait
      obstacles.push({kind:'air', sub:'ufo', hp:2, x:W + 60, y:GROUND - 100, base:GROUND - 100, w:56, h:30, t:Math.random() * 6});
    } else {                  // low UFO: slide under
      obstacles.push({kind:'air', sub:'ufo', hp:2, x:W + 60, y:GROUND - 34, base:GROUND - 34, w:56, h:26, t:Math.random() * 6});
    }
  } else if (air) {
    const by = level.hiAir && Math.random() < .4 ? GROUND - 98 : GROUND - 34;
    obstacles.push({kind:'air', x:W + 60, y:by, base:level.wob ? by : undefined, amp:level.wob || 0, w:46, h:26, t:Math.random() * 6});
  } else {
    const kinds = level.ground_, cluster = Math.random() < .2 ? 2 : 1;
    let x = W + 60;
    for (let i = 0; i < cluster; i++) {
      const k = kinds[Math.floor(Math.random() * kinds.length)], [w, h] = SIZES[k];
      obstacles.push({kind:k, x, y:GROUND, w, h, t:Math.random() * 6, vx:ENEMY_VX[k] || 0});
      x += w + 2;
    }
    if (Math.random() < .55) { const grp = obstacles.slice(-cluster); gemArc(W + 60, x - W - 62, GROUND - Math.max(...grp.map(g => g.h))); }
  }
  const airtime = 2 * Math.abs(level.jv) / level.g;
  const gx = level.gapX || [14, 48];
  spawnLeft = speed * (airtime + gx[0] + Math.random() * (gx[1] - gx[0]));
}

function hit(o) {
  const slide = player.sliding && player.onGround;
  const pw = slide ? 24 : 14, ph = slide ? 30 : 62;
  const px0 = player.x - pw, px1 = player.x + pw, py1 = player.y - 4, py0 = player.y - ph + 6;
  const ox0 = o.x + 5, ox1 = o.x + o.w - 5;
  const oy1 = (o.kind === 'air' ? o.y : o.y) - 3, oy0 = oy1 - o.h + 6;
  return px0 < ox1 && px1 > ox0 && py0 < oy1 && py1 > oy0;
}

function dust(x, y, n, col = 'rgba(255,255,255,.6)') {
  for (let i = 0; i < n; i++) particles.push({x, y, vx:-Math.random() * 2 - 1, vy:-Math.random() * 2, life:20 + Math.random() * 15, r:2 + Math.random() * 3, col});
}

function die() {
  player.dead = true; state = 'over'; shake = 18; flash = 1;
  beep(220, .5, 'sawtooth', .08, -180);
  dust(player.x, player.y - 30, 24, 'rgba(255,200,120,.9)');
  if (score > best) { best = score; try { localStorage.setItem('wheelrunner.best', best); } catch (e) {} }
  setTimeout(() => showOverlay('CRASHED!', 'Score ' + score + '  ·  Best ' + best + '  ·  Levels ' + levelsDone + '  ·  💎 +' + runGems, 'SPIN AGAIN'), 900);
}

// ---------------------------------------------------------------- update
function update(dt) {
  levelTime += dt;
  speed = level.speed + Math.min(2.5, levelTime * .0017) + Math.min(2, levelsDone * .2);
  dist += speed * dt;
  scoreAcc += speed * dt * .1 * level.mult; score = Math.floor(scoreAcc);

  const p = player;
  p.phase += speed * dt * .045;
  if (wantsSlide() && p.onGround) p.sliding = true; else if (!wantsSlide()) p.sliding = false;
  if (!p.onGround) {
    p.vy += level.g * (wantsSlide() ? 2.4 : 1) * dt; p.y += p.vy * dt;
    if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.onGround = true; dust(p.x, GROUND, 5); }
  } else if (Math.random() < .25 * dt) dust(p.x - 10, GROUND, 1, level.snow ? '#fff' : 'rgba(120,100,80,.5)');

  spawnLeft -= speed * dt;
  if (spawnLeft <= 0) spawn();
  if (p.inv > 0) p.inv -= dt;
  gemLeft -= speed * dt;
  if (gemLeft <= 0) { if (obstacles.some(o => o.x > W - 160)) gemLeft = 90; else { gemRow(); gemLeft = speed * (70 + Math.random() * 90); } }
  const gph = p.sliding && p.onGround ? 30 : 62;
  for (const g of gems) {
    g.x -= speed * dt; g.t += dt;
    if (has('magnet')) { const dx = p.x - g.x, dy = p.y - 30 - g.y, d = Math.hypot(dx, dy) || 1; if (d < 170) { g.x += dx / d * 9 * dt; g.y += dy / d * 9 * dt; } }
    if (Math.abs(g.x - p.x) < 26 && g.y > p.y - gph - 10 && g.y < p.y + 6) {
      g.got = true; save.gems += g.v; runGems += g.v; persist();
      beep(g.v > 1 ? 1100 : 880 + Math.min(300, runGems * 6 % 300), .07, 'triangle', .05); dust(g.x, g.y, 3, g.v > 1 ? '#d9a0ff' : '#8ff');
    }
  }
  gems = gems.filter(g => !g.got && g.x > -30);
  fireCD -= dt; if (p.flash > 0) p.flash -= dt;
  if (ammo < MAX_AMMO) { ammoT += dt; if (ammoT >= AMMO_REGEN) { ammo++; ammoT = 0; } } else ammoT = 0;
  for (const o of obstacles) {
    o.px = o.x;
    o.x -= (speed + (o.vx || 0)) * dt; o.t += .2 * dt;
    if (o.kind === 'meteor') o.y += o.vy * dt;
    else if (o.kind === 'hopper') o.y = GROUND - Math.abs(Math.sin(o.t * .5)) * 64;
    else if (o.base !== undefined) o.y = o.base + Math.sin(o.t * .8) * (o.amp || 8);
  }
  // bullets: swept test so fast shots never skip over thin targets
  for (const b of bullets) {
    b.px = b.x; b.x += b.vx * dt;
    for (const o of obstacles) {
      if (o.dead) continue;
      const bx0 = b.px, bx1 = b.x + 16, ox0 = Math.min(o.x, o.px) + 3, ox1 = Math.max(o.x, o.px) + o.w - 3;
      if (bx0 > ox1 || bx1 < ox0 || b.y + 6 < o.y - o.h || b.y - 6 > o.y) continue;
      b.gone = true;
      if (isEnemy(o)) {
        o.hp = (o.hp ?? 1) - 1;
        if (o.hp <= 0) killEnemy(o); else beep(500, .05, 'square', .04);
      } else { dust(b.x, b.y, 4, 'rgba(160,240,255,.9)'); beep(180, .04, 'square', .03); }
      break;
    }
  }
  const a = p.atk;
  if (a) {
    a.t += dt;
    if (a.t > a.w.dur) p.atk = null;
    else {
      const w = a.w, q = a.t / w.dur, reach = w.id === 'chain' ? w.range * Math.min(1, q * 3) : w.range;
      const zx0 = p.x + 8, zx1 = p.x + 8 + reach, zy0 = p.y - w.band[1], zy1 = p.y - w.band[0];
      for (const o of obstacles) {
        if (o.dead || (o.hitBy === a.id)) continue;
        if (o.x + o.w - 3 < zx0 || o.x + 3 > zx1 || o.y < zy0 || o.y - o.h > zy1) continue;
        if (isEnemy(o)) {
          o.hp = (o.hp ?? 1) - w.dmg;
          if (o.hp <= 0) killEnemy(o); else { o.hitBy = a.id; dust(o.x, o.y - o.h / 2, 5, 'rgba(255,255,255,.9)'); beep(500, .05, 'square', .04); }
        } else if (w.breaks && SOFT.has(o.kind)) {
          o.dead = true; scoreAcc += 20 * level.mult; dust(o.x + o.w / 2, o.y - o.h / 2, 12, 'rgba(190,140,80,.95)'); beep(150, .1, 'sawtooth', .05, -50);
        }
      }
    }
  }
  bullets = bullets.filter(b => !b.gone && b.x < W + 40);
  obstacles = obstacles.filter(o => !o.dead);
  for (const o of obstacles) {
    if (!hit(o) || p.inv > 0) continue;
    if (armor > 0) {                                  // armor soaks the crash and smashes the obstacle
      armor--; p.inv = 70; o.dead = true; shake = 9; flash = .5;
      dust(o.x + o.w / 2, o.y - o.h / 2, 16, 'rgba(255,210,90,.95)'); beep(200, .25, 'sawtooth', .07, -120);
    } else { die(); break; }
  }
  obstacles = obstacles.filter(o => !o.dead && o.x > -120 && o.y < GROUND + 40);

  if (levelTime >= LEVEL_FRAMES && state === 'play') {
    levelsDone++; state = 'wheel'; beep(660, .15); setTimeout(() => beep(990, .25), 140);
    showOverlay('LEVEL CLEAR!', 'Spin the wheel to pick your next level.', 'SPIN');
  }
}

// ---------------------------------------------------------------- drawing
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
let scroll = 0;

function drawBG(L) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const s1 = scroll * .15, s2 = scroll * .35;
  const bg = L.bg;

  if (bg === 'stars' || bg === 'stripes' || bg === 'graveyard') {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 70; i++) {
      const x = ((hash(i) * W * 1.2 - s1 * .3) % W + W) % W, y = hash(i + 99) * (GROUND - 60);
      ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(clock * .03 + i)); ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  if (bg === 'stars') {                           // big earth
    ctx.fillStyle = '#3b6ed1'; ctx.beginPath(); ctx.arc(720, 90, 46, 0, 7); ctx.fill();
    ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.arc(705, 82, 18, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(738, 108, 12, 0, 7); ctx.fill();
  }
  if (bg === 'graveyard') { ctx.fillStyle = '#f2eec8'; ctx.beginPath(); ctx.arc(150, 90, 38, 0, 7); ctx.fill(); ctx.fillStyle = L.sky[0]; ctx.beginPath(); ctx.arc(138, 82, 34, 0, 7); ctx.fill(); }
  if (bg === 'hills' || bg === 'dunes' || bg === 'mountains' || bg === 'volcano' || bg === 'storm' || bg === 'stars' || bg === 'jungle' || bg === 'graveyard' || bg === 'candy' || bg === 'reef') {
    ctx.fillStyle = L.far; ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W + 8; x += 8) {
      const u = x + s1;
      let h;
      if (bg === 'mountains') h = 40 + 110 * Math.abs(Math.sin(u * .006) * Math.cos(u * .0023 + 1));
      else if (bg === 'volcano') h = 30 + 120 * Math.pow(Math.abs(Math.sin(u * .004)), 2);
      else if (bg === 'dunes') h = 30 + 50 * (.5 + .5 * Math.sin(u * .008)) + 20 * Math.sin(u * .02);
      else if (bg === 'storm') h = 30 + 70 * (.5 + .5 * Math.sin(u * .005 + Math.sin(u * .013)));
      else if (bg === 'candy') h = 40 + 70 * Math.abs(Math.sin(u * .006));
      else if (bg === 'reef') h = 30 + 80 * Math.pow(Math.abs(Math.sin(u * .005)), .6) * (.6 + .4 * Math.sin(u * .02));
      else if (bg === 'stars') h = 20 + 30 * Math.abs(Math.sin(u * .01));
      else h = 40 + 60 * (.5 + .5 * Math.sin(u * .007)) + 20 * Math.sin(u * .019);
      ctx.lineTo(x, GROUND - h);
    }
    ctx.lineTo(W, GROUND); ctx.fill();
    if (bg === 'volcano') {                       // glow
      ctx.fillStyle = 'rgba(255,120,30,.25)'; ctx.fillRect(0, GROUND - 40, W, 40);
    }
    if (bg === 'storm') {
      ctx.fillStyle = 'rgba(20,24,30,.55)'; ctx.fillRect(0, 0, W, 100);
      if ((clock % 240) > 232) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, 0, W, H); }
    }
  }
  if (bg === 'jungle') {
    ctx.strokeStyle = '#1f6b36'; ctx.lineWidth = 4;
    for (let i = 0; i < 9; i++) { const x = ((i * 110 - s2) % (W + 110) + W + 110) % (W + 110) - 20, l = 60 + hash(i) * 120; ctx.beginPath(); ctx.moveTo(x, 0); ctx.quadraticCurveTo(x + 10, l / 2, x - 4 + Math.sin(clock * .03 + i) * 4, l); ctx.stroke(); }
  }
  if (bg === 'reef') {
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 26; i++) { const x = (hash(i) * W + Math.sin(clock * .03 + i) * 8 - s1 * .2 + W) % W, y = GROUND - ((hash(i + 3) * GROUND + clock * (.4 + hash(i + 8))) % GROUND); ctx.beginPath(); ctx.arc(x, y, 2 + hash(i + 5) * 4, 0, 7); ctx.fill(); }
  }
  if (bg === 'candy') {
    for (let i = 0; i < 7; i++) { const x = ((i * 150 - s2) % (W + 150) + W + 150) % (W + 150) - 40, h = 50 + hash(i) * 40; ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, GROUND - h, 4, h); ctx.fillStyle = ['#ff4d9a', '#7be0ff', '#ffe45e'][i % 3]; ctx.beginPath(); ctx.arc(x, GROUND - h, 15, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(x, GROUND - h, 7, 0, 7); ctx.fill(); }
  }
  if (bg === 'city') {
    const bw = 54;
    for (let layer = 0; layer < 2; layer++) {
      const sc = layer ? s2 : s1; ctx.fillStyle = layer ? '#14163a' : L.far;
      const first = Math.floor(sc / bw);
      for (let i = first; i < first + W / bw + 2; i++) {
        const h = 60 + hash(i + layer * 50) * (layer ? 130 : 170), x = i * bw - sc;
        ctx.fillStyle = layer ? '#12142f' : L.far; ctx.fillRect(x, GROUND - h, bw - 4, h);
        ctx.fillStyle = 'rgba(255,220,120,.55)';
        for (let wy = GROUND - h + 10; wy < GROUND - 14; wy += 18)
          for (let wx = x + 7; wx < x + bw - 14; wx += 14) if (hash(wx * .31 + wy + i) > .55) ctx.fillRect(wx, wy, 6, 8);
      }
    }
  }
  if (bg === 'stripes') {
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 3;
    for (let i = 0; i < 14; i++) {
      const y = 30 + hash(i) * (GROUND - 80), x = ((hash(i + 7) * W - scroll * 1.6) % (W + 200) + W + 200) % (W + 200) - 100;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 90 + hash(i + 3) * 80, y); ctx.stroke();
    }
  }
  if (bg === 'hills' || bg === 'dunes') {          // clouds / sun
    ctx.fillStyle = bg === 'dunes' ? '#fff3a8' : '#fff'; ctx.globalAlpha = .9;
    if (bg === 'dunes') { ctx.beginPath(); ctx.arc(760, 80, 42, 0, 7); ctx.fill(); }
    else for (let i = 0; i < 4; i++) {
      const x = ((i * 260 - scroll * .08) % (W + 200) + W + 200) % (W + 200) - 100, y = 50 + (i % 2) * 40;
      ctx.beginPath(); ctx.arc(x, y, 18, 0, 7); ctx.arc(x + 20, y - 8, 22, 0, 7); ctx.arc(x + 44, y, 17, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (L.snow) {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 60; i++) {
      const x = ((hash(i) * W - scroll * .5 + Math.sin(clock * .02 + i) * 20) % W + W) % W, y = (hash(i + 5) * H + clock * (1 + hash(i + 9) * 1.5)) % GROUND;
      ctx.fillRect(x, y, 3, 3);
    }
  }
  // ground
  ctx.fillStyle = L.ground; ctx.fillRect(0, GROUND, W, 14);
  ctx.fillStyle = L.dirt; ctx.fillRect(0, GROUND + 14, W, H - GROUND - 14);
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  for (let i = 0; i < 24; i++) { const x = ((i * 70 - scroll) % (W + 70) + W + 70) % (W + 70) - 35; ctx.fillRect(x, GROUND + 28 + (i % 3) * 22, 26, 4); }
  if (L.bg === 'volcano') { ctx.fillStyle = '#ff7a1a'; ctx.fillRect(0, GROUND + 14, W, 3); }
}

function drawObstacle(o, L) {
  const x = o.x, y = o.y;
  ctx.save();
  if (o.kind === 'rock') {
    ctx.fillStyle = '#7b7b86'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 6, y - o.h * .7); ctx.lineTo(x + o.w * .4, y - o.h); ctx.lineTo(x + o.w * .8, y - o.h * .75); ctx.lineTo(x + o.w, y); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.moveTo(x + 6, y - o.h * .7); ctx.lineTo(x + o.w * .4, y - o.h); ctx.lineTo(x + o.w * .45, y - o.h * .5); ctx.fill();
  } else if (o.kind === 'crate') {
    ctx.fillStyle = '#b9772f'; ctx.fillRect(x, y - o.h, o.w, o.h);
    ctx.strokeStyle = '#6b3f12'; ctx.lineWidth = 4; ctx.strokeRect(x + 2, y - o.h + 2, o.w - 4, o.h - 4);
    ctx.beginPath(); ctx.moveTo(x + 4, y - o.h + 4); ctx.lineTo(x + o.w - 4, y - 4); ctx.moveTo(x + o.w - 4, y - o.h + 4); ctx.lineTo(x + 4, y - 4); ctx.stroke();
  } else if (o.kind === 'cactus') {
    ctx.fillStyle = '#2e8b3d'; const cx = x + o.w / 2;
    ctx.beginPath(); ctx.roundRect(cx - 7, y - o.h, 14, o.h, 7); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x, y - o.h * .62, 10, 7, 4); ctx.roundRect(x, y - o.h * .62 - 14, 8, 20, 4); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + o.w - 10, y - o.h * .5, 10, 7, 4); ctx.roundRect(x + o.w - 8, y - o.h * .5 - 16, 8, 22, 4); ctx.fill();
  } else if (o.kind === 'fire') {
    const f = Math.sin(o.t * 3) * 4, cx = x + o.w / 2;
    const gr = ctx.createLinearGradient(0, y - o.h, 0, y); gr.addColorStop(0, '#ffe45e'); gr.addColorStop(.5, '#ff8a1f'); gr.addColorStop(1, '#d02a0a');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 4, y - o.h * .5, cx + f, y - o.h); ctx.quadraticCurveTo(x + o.w + 4, y - o.h * .5, x + o.w, y); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,.8)'; ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.quadraticCurveTo(cx - 4, y - o.h * .4, cx + f * .5, y - o.h * .6); ctx.quadraticCurveTo(cx + 8, y - o.h * .3, x + o.w - 10, y); ctx.fill();
  } else if (o.kind === 'crystal') {
    const col = L.name === 'Turbo' ? '#ff6ad5' : L.name === 'Moon' ? '#a9b4ff' : '#9fe2ff';

  ctx.restore();
}

function render() {
  ctx.save();
  if (shake > .5) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .9; }
  drawBG(level);
  for (const o of obstacles) drawObstacle(o, level);
  for (const q of particles) { ctx.globalAlpha = Math.max(0, q.life / 35); ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const g of gems) {
    const by = g.y + Math.sin(g.t * .12) * 3, r = g.v > 1 ? 14 : 10, c = g.v > 1 ? ['#c26bff', '#e6bcff', '#8a3fd1'] : ['#38e1ff', '#c9f7ff', '#1796c7'];
    ctx.fillStyle = c[0]; ctx.beginPath(); ctx.moveTo(g.x, by - r); ctx.lineTo(g.x + r, by - r * .2); ctx.lineTo(g.x, by + r); ctx.lineTo(g.x - r, by - r * .2); ctx.fill();
    ctx.fillStyle = c[1]; ctx.beginPath(); ctx.moveTo(g.x, by - r); ctx.lineTo(g.x - r, by - r * .2); ctx.lineTo(g.x, by - r * .2); ctx.fill();
    ctx.fillStyle = c[2]; ctx.beginPath(); ctx.moveTo(g.x, by - r * .2); ctx.lineTo(g.x + r, by - r * .2); ctx.lineTo(g.x, by + r); ctx.fill();
    if (Math.floor(g.t / 20) % 4 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(g.x - 1, by - r - 4, 2, 8); ctx.fillRect(g.x - 4, by - r - 1, 8, 2); }
  }
  for (const b of bullets) {
    const tg = ctx.createLinearGradient(b.x - 30, 0, b.x + 16, 0); tg.addColorStop(0, 'rgba(25,211,255,0)'); tg.addColorStop(1, 'rgba(25,211,255,.8)');
    ctx.fillStyle = tg; ctx.fillRect(b.x - 30, b.y - 3, 46, 6);
    ctx.fillStyle = '#e8ffff'; ctx.beginPath(); ctx.roundRect(b.x, b.y - 4, 16, 8, 4); ctx.fill();
  }
  drawPlayer(player);
  ctx.restore();
  if (flash > .02) { ctx.fillStyle = 'rgba(255,255,255,' + flash * .7 + ')'; ctx.fillRect(0, 0, W, H); flash *= .85; }

  // HUD
  ctx.textBaseline = 'top'; ctx.lineJoin = 'round';
  const hudTxt = (t, x, y, size, align = 'left') => {
    ctx.font = '800 ' + size + 'px system-ui,sans-serif'; ctx.textAlign = align;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(t, x, y); ctx.fillStyle = '#fff'; ctx.fillText(t, x, y);
  };
  hudTxt(String(score).padStart(5, '0'), W - 18, 14, 30, 'right');
  hudTxt('BEST ' + String(best).padStart(5, '0'), W - 18, 50, 16, 'right');
  hudTxt('💎 ' + save.gems + (runGems ? '  +' + runGems : ''), W - 18, 74, 18, 'right');
  for (let i = 0; i < armorMax(); i++) {
    const sx = W - 30 - i * 22, sy = 102;
    ctx.beginPath(); ctx.moveTo(sx - 8, sy - 8); ctx.lineTo(sx + 8, sy - 8); ctx.lineTo(sx + 8, sy + 1); ctx.quadraticCurveTo(sx + 8, sy + 8, sx, sy + 11); ctx.quadraticCurveTo(sx - 8, sy + 8, sx - 8, sy + 1); ctx.closePath();
    ctx.fillStyle = i < armor ? '#ffd23f' : 'rgba(0,0,0,.45)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
  }
  hudTxt(level.icon + ' ' + level.name.toUpperCase() + (level.mult > 1 ? '  x' + level.mult : ''), 18, 14, 22);
  const prog = state === 'title' ? 0 : Math.min(1, levelTime / LEVEL_FRAMES);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(18, 46, 160, 8);
  ctx.fillStyle = level.wheel; ctx.fillRect(18, 46, 160 * prog, 8);
  for (let i = 0; i < MAX_AMMO; i++) {
    const px = 18 + i * 22; ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(px, 62, 18, 9);
    const f = i < ammo ? 1 : i === ammo ? ammoT / AMMO_REGEN : 0;
    ctx.fillStyle = '#19d3ff'; ctx.fillRect(px, 62, 18 * f, 9);
  }
  for (let i = 0; i < WEAPONS.length; i++) {
    const wx = 18 + i * 34, sel = i === weapon;
    ctx.fillStyle = sel ? 'rgba(255,210,63,.85)' : 'rgba(0,0,0,.45)'; ctx.fillRect(wx, 78, 30, 26);
    ctx.font = '16px system-ui,"Apple Color Emoji","Segoe UI Emoji"'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.globalAlpha = ownsWeapon(WEAPONS[i]) ? 1 : .35; ctx.fillText(WEAPONS[i].icon, wx + 15, 82); ctx.globalAlpha = 1;
    if (!ownsWeapon(WEAPONS[i])) { ctx.font = '10px system-ui,"Apple Color Emoji"'; ctx.fillText('🔒', wx + 22, 94); }
    ctx.font = '700 10px system-ui'; ctx.fillStyle = sel ? '#2b1700' : '#cfd6e6'; ctx.fillText(String(i + 1), wx + 5, 79);
  }
  if (toast > 0) { toast -= .5; ctx.globalAlpha = Math.min(1, toast / 20); hudTxt(toastMsg.toUpperCase(), 160, 82, 18); ctx.globalAlpha = 1; }
  if (state === 'play' && levelTime < 90) { ctx.globalAlpha = 1 - levelTime / 90; hudTxt(level.text, W / 2, 110, 30, 'center'); ctx.globalAlpha = 1; }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(2.5, (now - last) / 16.667); last = now; clock += dt;
  scroll += (state === 'play' || state === 'over' ? (state === 'over' ? 0 : speed) : 1.2) * dt;
  if (state === 'play') update(dt);
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  render();
  if (!overlay.classList.contains('hidden')) drawWheel();
  requestAnimationFrame(frame);
}

showOverlay('WHEEL RUNNER', 'Run forever. Dodge everything. Spin the wheel to decide which level you face.', 'SPIN THE WHEEL');
requestAnimationFrame(frame);
// test hook
window.__game = {get state(){return state}, get score(){return score}, get level(){return level.name}, spin:primary, jump};
})();
</script>
