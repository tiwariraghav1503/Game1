<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wheel Runner</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d17;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*900/420));aspect-ratio:900/420;container-type:size;background:#000;box-shadow:0 0 40px #000a}
  canvas#game{width:100%;height:100%;display:block}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5cqw;background:rgba(5,7,20,.72);backdrop-filter:blur(2px)}
  #overlay.hidden{display:none}
  #wheel{height:88cqh;aspect-ratio:1;max-width:46cqw}
  #panel{display:flex;flex-direction:column;align-items:flex-start;gap:2.4cqh;max-width:38cqw}
  #ptitle{margin:0;font-size:9cqh;line-height:1;letter-spacing:.02em;text-shadow:0 .5cqh 0 #0006}
  #ptext{margin:0;font-size:4.4cqh;line-height:1.3;opacity:.9}
  #result{margin:0;font-size:6cqh;font-weight:800;min-height:7cqh}
  #btn{font:inherit;font-weight:800;font-size:5.5cqh;padding:1.6cqh 4cqh;border:0;border-radius:99px;background:linear-gradient(#ffd23f,#ff9f1c);color:#2b1700;cursor:pointer;box-shadow:0 .8cqh 0 #b36b00;transition:transform .08s}
  #btn:active{transform:translateY(.6cqh);box-shadow:0 .2cqh 0 #b36b00}
  #btn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
  #fire{position:absolute;right:3cqw;bottom:6cqh;width:15cqh;height:15cqh;border-radius:50%;border:0;background:radial-gradient(#7ff,#09a);color:#012;font:800 3.4cqh system-ui;box-shadow:0 .8cqh 0 #056,0 0 3cqh #0cf8;opacity:.8;touch-action:none}
  #swap{position:absolute;right:21cqh;bottom:6cqh;width:10cqh;height:10cqh;border-radius:50%;border:0;background:#ffd23f;color:#2b1700;font:800 2.6cqh system-ui;box-shadow:0 .6cqh 0 #b36b00;opacity:.85;touch-action:none}
  #dash{display:none;position:absolute;right:33cqh;bottom:6cqh;width:10cqh;height:10cqh;border-radius:50%;border:0;background:#c58bff;color:#220a3a;font:800 2.4cqh system-ui;box-shadow:0 .6cqh 0 #7a3fc4;opacity:.85;touch-action:none}
  #mvl,#mvr{display:none;position:absolute;bottom:6cqh;width:14cqh;height:14cqh;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font:800 6cqh system-ui;touch-action:none}
  #mvl{left:3cqw}
  #mvr{left:calc(3cqw + 17cqh)}
  #fire:active{transform:translateY(.6cqh)}
  #btns{display:flex;gap:2cqw;align-items:center}
  #shopBtn{font:inherit;font-weight:800;font-size:4.4cqh;padding:1.6cqh 3cqh;border:0;border-radius:99px;background:linear-gradient(#6ef0ff,#16a6d9);color:#032031;cursor:pointer;box-shadow:0 .8cqh 0 #0b6a8f}
  #shopBtn:active{transform:translateY(.6cqh);box-shadow:0 .2cqh 0 #0b6a8f}
  #shopBtn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
  #shop{position:absolute;inset:0;display:flex;flex-direction:column;gap:2cqh;padding:3cqh 4cqw;box-sizing:border-box;background:rgba(6,8,22,.95)}
  #shop.hidden{display:none}
  #shophead{display:flex;align-items:center;gap:3cqw}
  #shophead h2{margin:0 1cqw 0 0;font-size:7cqh;line-height:1}
  .tab{font:inherit;font-weight:800;font-size:3.6cqh;padding:1cqh 2.4cqh;border:0;border-radius:99px;background:#232842;color:#9fa8cc;cursor:pointer}
  .tab.on{background:#6ef0ff;color:#032031}
  #shopmsg{font-size:3.2cqh;min-height:4cqh;color:#ffd23f}
  .card.pack b{font-size:5cqh;color:#6ef0ff}
  .port{height:14cqh;width:auto;align-self:flex-start}
  .card .tag{font-size:2.8cqh;color:#ffd23f;min-height:3.4cqh}
  #gemcount{font-size:5cqh;font-weight:800;color:#6ef0ff;flex:1}
  #shopclose{font:inherit;font-weight:800;font-size:4.4cqh;padding:1.2cqh 3cqh;border:0;border-radius:99px;background:#ffd23f;color:#2b1700;cursor:pointer}
  #items{display:grid;grid-template-columns:repeat(5,1fr);gap:2cqh 1.2cqw;flex:1;min-height:0}
  .card{background:#1a1f38;border-radius:2cqh;padding:1.6cqh 1.8cqw;display:flex;flex-direction:column;gap:.6cqh;min-height:0;min-width:0}
  .card .ic{font-size:5.2cqh;line-height:1}
  .card .tp{font-size:2.6cqh;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
  .card b{font-size:3.5cqh}
  .card small{font-size:2.4cqh;opacity:.8;line-height:1.2;flex:1}
  .card button{font:inherit;font-weight:800;font-size:3.3cqh;padding:1cqh 0;border:0;border-radius:1.4cqh;background:#6ef0ff;color:#032031;cursor:pointer}
  .card button:disabled{background:#303652;color:#8a93b5;cursor:default}
  .card.owned button{background:#2f7d4b;color:#d8ffe6}
  #keys{font-size:3.2cqh;opacity:.6}
  #resetBtn{font:inherit;font-weight:700;font-size:2.6cqh;padding:.8cqh 2cqh;border:.3cqh solid rgba(255,120,120,.7);border-radius:99px;background:transparent;color:#ff9a9a;cursor:pointer;align-self:flex-start}
  #resetBtn.armed{background:#d93a3a;color:#fff;border-color:#d93a3a}
  #heropick{display:flex;align-items:center;gap:1.4cqw;background:rgba(255,255,255,.1);border-radius:2cqh;padding:1cqh 1.6cqw}
  #heropick .arr{font:inherit;font-weight:800;font-size:4.4cqh;width:6cqh;height:6cqh;border:0;border-radius:50%;background:#ffd23f;color:#2b1700;cursor:pointer}
  #heropick .arr:disabled{background:#303652;color:#8a93b5;cursor:default}
  #hport{width:8cqh;height:11cqh}
  #hname{display:flex;flex-direction:column;min-width:13cqw}
  #hname b{font-size:3.6cqh}
  #hname small{font-size:2.3cqh;opacity:.75;line-height:1.2}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="900" height="420"></canvas>
    <button id="fire" aria-label="Fire">FIRE</button>
    <button id="mvl" aria-label="Move left">◀</button><button id="mvr" aria-label="Move right">▶</button>
    <button id="dash" aria-label="Dash">DASH</button>
    <button id="swap" aria-label="Switch weapon">SWAP</button>
    <div id="overlay">
      <canvas id="wheel" width="560" height="560"></canvas>
      <div id="panel">
        <h1 id="ptitle">WHEEL RUNNER</h1>
        <p id="ptext"></p>
        <p id="result"></p>
        <div id="heropick"><button class="arr" id="hprev" aria-label="Previous hero">◀</button><canvas id="hport" width="80" height="110"></canvas><div id="hname"><b></b><small></small></div><button class="arr" id="hnext" aria-label="Next hero">▶</button></div>
        <div id="btns"><button id="btn">SPIN</button><button id="shopBtn">SHOP 💎</button></div>
        <button id="resetBtn">RESET TO LEVEL 1</button>
        <div id="keys">Space / ↑ = jump &nbsp;·&nbsp; ↓ = slide &nbsp;·&nbsp; ← → = move (boss fights) &nbsp;·&nbsp; F / X = attack &nbsp;·&nbsp; Q or 1-9, 0, - = switch weapon &nbsp;·&nbsp; H / [ ] / ← → on this screen = switch hero &nbsp;·&nbsp; E = dash (boss perk) &nbsp;·&nbsp; touch: tap top = jump, hold bottom = slide, FIRE / SWAP buttons</div>
      </div>
    </div>
    <div id="shop" class="hidden">
      <div id="shophead"><h2>SHOP</h2><button class="tab on" data-tab="gear">GEAR</button><button class="tab" data-tab="heroes">HEROES</button><button class="tab" data-tab="gems">GET GEMS</button><span id="gemcount"></span><button id="shopclose">BACK</button></div>
      <div id="shopmsg"></div>
      <div id="items"></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 900, H = 420, GROUND = 340;
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const wcv = document.getElementById('wheel'), wctx = wcv.getContext('2d');
const overlay = document.getElementById('overlay');
const $shop = document.getElementById('shop'), $shopBtn = document.getElementById('shopBtn');
const $title = document.getElementById('ptitle'), $text = document.getElementById('ptext');
const $result = document.getElementById('result'), $btn = document.getElementById('btn');

// ---------------------------------------------------------------- levels
// The wheel picks one of these. Each changes theme, speed, gravity and hazards.
const LEVELS = [
  {name:'Meadow',  icon:'🌿', wheel:'#4caf50', sky:['#7cc8ff','#e6f7ff'], ground:'#58b85c', dirt:'#6d4c41', bg:'hills',     far:'#8fd18f', speed:6,   g:.8,  jv:-15,  ground_:['rock','crate'],     air:'bird',  airP:.22, mult:1, text:'Easy jog. Warm up.'},
  {name:'Desert',  icon:'🏜️', wheel:'#e0a030', sky:['#ffd27f','#fff3d1'], ground:'#e6bd6a', dirt:'#b9894a', bg:'dunes',     far:'#efc57c', speed:7,   g:.8,  jv:-15,  ground_:['cactus','rock'],    air:'bird',  airP:.25, mult:1, text:'Cacti everywhere.'},
  {name:'Snow',    icon:'❄️', wheel:'#6ec6ff', sky:['#b6d6ee','#f6fcff'], ground:'#f3faff', dirt:'#9fb8c9', bg:'mountains', far:'#c3d4e4', speed:7,   g:.8,  jv:-15,  ground_:['crystal','rock'],   air:'bird',  airP:.25, mult:1, text:'Ice spikes ahead.', snow:true},
  {name:'Moon',    icon:'🌙', wheel:'#8e8ce6', sky:['#04050e','#1c2040'], ground:'#9c9cab', dirt:'#5f5f70', bg:'stars',     far:'#2a2f5a', speed:8,   g:.38, jv:-11,  ground_:['tallrock','spire','alien','tallrock'], air:'ufo', airP:.42, gapX:[6,24], mult:1, text:'Low gravity. Tall rocks, aliens, UFOs, meteors.'},
  {name:'Lava',    icon:'🔥', wheel:'#ff5a36', sky:['#380808','#b3320c'], ground:'#3b2a2a', dirt:'#ff5a1f', bg:'volcano',   far:'#5a1a12', speed:8.5, g:.85, jv:-15.5,ground_:['fire','rock'],      air:'ember', airP:.3,  mult:1, text:'Hot. Fast. Don\'t touch.'},
  {name:'City',    icon:'🌃', wheel:'#b05cff', sky:['#0b0f33','#41306e'], ground:'#2c3047', dirt:'#1c1f31', bg:'city',      far:'#1b1d44', speed:8,   g:.8,  jv:-15,  ground_:['crate','rock'],     air:'drone', airP:.3,  mult:1, text:'Night run. Watch the drones.'},
  {name:'Storm',   icon:'⛈️', wheel:'#5a7a99', sky:['#1c2229','#4c5865'], ground:'#3a4a3b', dirt:'#252e26', bg:'storm',     far:'#303a44', speed:9,   g:.8,  jv:-15,  ground_:['rock','cactus','crate'], air:'bird', airP:.3, mult:1, text:'Thunder and chaos.'},
  {name:'Jungle',  icon:'🌴', wheel:'#2e9e5b', sky:['#5fc98a','#e4ffd6'], ground:'#2f8f46', dirt:'#5a3a22', bg:'jungle',    far:'#2f8f4f', speed:7.5, g:.8,  jv:-15,  ground_:['log','snake','hopper','rock'], air:'bat', airP:.28, hiAir:1, wob:10, hop:'frog', mult:1, text:'Logs, snakes and hopping frogs.'},
  {name:'Graveyard',icon:'👻', wheel:'#6b4ea3', sky:['#150f2c','#4d3a70'], ground:'#2b2b38', dirt:'#16161f', bg:'graveyard', far:'#2a2146', speed:8,   g:.8,  jv:-15,  ground_:['tomb','zombie','spikes'],     air:'ghost', airP:.35, hiAir:1, wob:14, mult:1, text:'Zombies rise. Ghosts float.'},
  {name:'Candy',   icon:'🍭', wheel:'#ff6fb5', sky:['#ffbde0','#fff1fa'], ground:'#ff8fc7', dirt:'#c2549a', bg:'candy',     far:'#ffa6d6', speed:8,   g:.8,  jv:-15,  ground_:['cane','hopper','crate'],      air:'bee',   airP:.3,  hiAir:1, wob:12, hop:'gummy', mult:1, text:'Sweet, but it bites.'},
  {name:'Reef',    icon:'🌊', wheel:'#1fa3c9', sky:['#0a5a8c','#74dbe9'], ground:'#e8d49a', dirt:'#b09a5c', bg:'reef',      far:'#2a8db3', speed:7.5, g:.5,  jv:-12,  ground_:['coral','urchin','crab'],      air:'jelly', airP:.33, hiAir:1, wob:16, mult:1, text:'Underwater drift. Crabs scuttle fast.'},
  {name:'Turbo',   icon:'⚡', wheel:'#ff3d9a', sky:['#1a0033','#ff2d95'], ground:'#1b1b2f', dirt:'#0f0f1c', bg:'stripes',   far:'#4d0a60', speed:11,  g:.8,  jv:-15,  ground_:['crystal','crate'],  air:'drone', airP:.3,  mult:2, text:'Maximum speed. Double points!'},
];
const LEVEL_FRAMES = 60 * 24;   // ~24 s per wheel spin

// ---------------------------------------------------------------- audio
let actx = null;
function beep(f, d = .08, type = 'square', vol = .05, slide = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), actx.currentTime + d);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

// ---------------------------------------------------------------- state
let state = 'title';       // title | spinning | play | wheel | over
let level = LEVELS[0], levelIdx = 0;
let best = 0;
try { best = +localStorage.getItem('wheelrunner.best') || 0; } catch (e) {}

// weapons: the gun is ranged and uses ammo; the rest are melee swings with a reach and a height band above the feet
const WEAPONS = [
  {id:'gun',   name:'Blaster', icon:'🔫'},
  {id:'sword', name:'Sword',   icon:'🗡️', range:80,  band:[10, 80], dur:10, cd:24, dmg:2, breaks:true},
  {id:'stick', name:'Stick',   icon:'🦯', range:58,  band:[0, 38],  dur:7,  cd:11, dmg:1},
  {id:'chain', name:'Chain',   icon:'⛓️', range:150, band:[6, 72],  dur:16, cd:34, dmg:1},
  // boss drops: overpowered, fuelled by the POWER meter. Owning one also grants a permanent agility perk.
  {id:'slimecannon', op:true, name:'Slime Cannon', icon:'🟢', cost:30, cd:22, perk:'Double jump',   desc:'Giant slime glob flattens everything in its path.'},
  {id:'railgun',     op:true, name:'Plasma Railgun', icon:'🔵', cost:50, cd:26, perk:'Jet hover (hold jump)', desc:'Instant beam across the whole screen.'},
  {id:'titanfist',   op:true, name:'Titan Fist', icon:'👊', cost:40, cd:30, perk:'Bulldozer slide (smash low obstacles)', desc:'Sends a ground quake that wrecks everything.'},
  {id:'reapersaw',   op:true, name:'Reaper Saw', icon:'⚙️', cost:35, cd:24, perk:'Phase dash (E / Shift)', desc:'Boomerang saw that cuts both ways.'},
  // heavy ranged weapons: spend several ammo per shot
  {id:'sniper',   ranged:true, ammo:3, cd:42, name:'Sniper Rifle',    icon:'🎯'},
  {id:'rpg',      ranged:true, ammo:2, cd:38, name:'RPG',             icon:'💥'},
  {id:'launcher', ranged:true, ammo:3, cd:55, name:'Rocket Launcher', icon:'🚀'},
];
const SOFT = new Set(['crate', 'barrel', 'log', 'cactus', 'cane', 'coral']);   // the sword can chop these
let weapon = 0, atkId = 0, toast = 0;
let bullets, ammo, ammoT, fireCD;
const AMMO_REGEN = 55;
const maxAmmo = () => 6 + CH().ammo;
// ---------------------------------------------------------------- save + gear
// playable heroes: each trades something for something. Unspecified stats default to 1 / 0.
const HEROES = [
  {id:'runner',    name:'Runner',    cost:0,   desc:'Balanced all-rounder. Free starter.', skin:'#f2c29b', shirt:'#e63946', pants:'#274c77', shoe:'#fff',    hair:'#3b2314'},
  {id:'ninja',     name:'Ninja',     cost:150, desc:'Jumps 12% higher. Melee swings 25% faster.', skin:'#e8b890', shirt:'#23232e', pants:'#2e2e3c', shoe:'#111',    hair:'#111', jump:1.12, melee:.75},
  {id:'cowboy',    name:'Cowboy',    cost:150, desc:'Carries 9 shots and reloads 35% faster.', skin:'#e8b48c', shirt:'#3b78c4', pants:'#6b4a2a', shoe:'#4a2e14', hair:'#7a4a1a', ammo:3, regen:1.35},
  {id:'knight',    name:'Knight',    cost:250, desc:'Starts each run with +1 armor. Heavy: lower jump, slower walk.', skin:'#f0c8a0', shirt:'#aab6cf', pants:'#6b7690', shoe:'#555e75', hair:'#5b3a1a', armor:1, jump:.94, walk:.85},
  {id:'astronaut', name:'Astronaut', cost:250, desc:'Floaty jumps. Pinch the screen (or press G) to fly for 10 seconds.', skin:'#f2c29b', shirt:'#f1f3f8', pants:'#dfe4ee', shoe:'#9aa6bd', hair:'#3b2314', grav:.75, jump:.95},
  {id:'hunter',    name:'Treasure Hunter', cost:300, desc:'Built-in magnet and 25% more diamonds.', skin:'#d9a272', shirt:'#3b9a6a', pants:'#8a6a3a', shoe:'#4a3320', hair:'#2a1a10', gem:1.25, magnet:true},
].map(h => Object.assign({jump:1, grav:1, armor:0, walk:1, ammo:0, regen:1, melee:1, gem:1, magnet:false}, h));
let save = {gems:0, owned:{}, hero:'runner'};
try { const j = JSON.parse(localStorage.getItem('wheelrunner.save') || 'null'); if (j) save = {gems:+j.gems || 0, owned:j.owned || {}, hero:j.hero || 'runner'}; } catch (e) {}
if (!HEROES.some(h => h.id === save.hero && (h.cost === 0 || save.owned['hero_' + h.id]))) save.hero = 'runner';
const CH = () => HEROES.find(h => h.id === save.hero) || HEROES[0];
const persist = () => { try { localStorage.setItem('wheelrunner.save', JSON.stringify(save)); } catch (e) {} };
const has = id => !!save.owned[id];
const ARMOR_VAL = {helmet:1, vest:2, boots:1};
const armorMax = () => Object.keys(ARMOR_VAL).reduce((n, k) => n + (has(k) ? ARMOR_VAL[k] : 0), CH().armor);
const ownsWeapon = w => w.id === 'gun' || has(w.id);   // the Blaster is the free starter weapon
const anyOP = () => WEAPONS.some(w => w.op && has(w.id));
const SHOP = [
  {id:'stick',  type:'Weapon', icon:'🦯', name:'Stick',  cost:60,  desc:'Fast, short swing. Good against low enemies.'},
  {id:'sword',  type:'Weapon', icon:'🗡️', name:'Sword',  cost:200, desc:'Strong swing. Chops crates, barrels and cacti.'},
  {id:'chain',  type:'Weapon', icon:'⛓️', name:'Chain',  cost:350, desc:'Long whip that hits at every height.'},
  {id:'helmet', type:'Armor',  icon:'⛑️', name:'Helmet', cost:80,  desc:'Absorbs 1 crash each run.'},
  {id:'vest',   type:'Armor',  icon:'🦺', name:'Vest',   cost:150, desc:'Absorbs 2 crashes each run.'},
  {id:'boots',  type:'Armor',  icon:'🥾', name:'Boots',  cost:100, desc:'Absorbs 1 crash each run.'},
  {id:'sniper',   type:'Weapon', icon:'🎯', name:'Sniper',   cost:250, desc:'Instant long shot through every enemy in line. 3 ammo.'},
  {id:'rpg',      type:'Weapon', icon:'💥', name:'RPG',      cost:400, desc:'Slow rocket with a big blast. 2 ammo.'},
  {id:'launcher', type:'Weapon', icon:'🚀', name:'Launcher', cost:500, desc:'Three homing missiles per salvo. 3 ammo.'},
  {id:'magnet', type:'Gear',   icon:'🧲', name:'Magnet', cost:120, desc:'Pulls nearby diamonds to you.'},
];
// Real-money gem packs. Payments are NOT connected: paste a hosted checkout link per pack below.
// Gems are never added by the page itself; crediting has to come from a server that confirms the payment.
const PAYMENT_LINKS = {};   // e.g. {pack100: 'https://buy.stripe.com/...'}
const PACKS = [
  {id:'pack100',  gems:100,  price:'$0.99',  tag:''},
  {id:'pack550',  gems:550,  price:'$4.99',  tag:'+10% bonus'},
  {id:'pack1200', gems:1200, price:'$9.99',  tag:'Best value'},
  {id:'pack3000', gems:3000, price:'$19.99', tag:'+25% bonus'},
];
let shopTab = 'gear';
let gems, runGems, armor, gemLeft, toastMsg = '';
let boss = null, eps = [], bossBanner = 0, supers = [], pow = 60, minis = [], chip = 0;
let player, obstacles, particles, dist, score, scoreAcc, levelTime, levelsDone, spawnLeft, speed, shake, flash, clock = 0;
const keys = {down:false, jump:false, left:false, right:false};
let touchDown = false, touchJump = false, touchL = false, touchR = false;

function resetGame() {
  player = {face:1, dj:false, fuel:60, dashCD:0, inv:0, atk:null, x:130, y:GROUND, vy:0, onGround:true, sliding:false, phase:0, dead:false, flyT:0, flyCD:0};
  obstacles = []; particles = []; bullets = []; gems = []; runGems = 0; armor = armorMax(); gemLeft = 500; boss = null; eps = []; bossBanner = 0; supers = []; pow = 60; minis = []; chip = 0; setBossUI(); ammo = maxAmmo(); ammoT = 0; fireCD = 0;
  dist = 0; score = 0; scoreAcc = 0; levelTime = 0; levelsDone = 0; shake = 0; flash = 0;
  spawnLeft = 600; speed = 6;
}
resetGame();

// ---------------------------------------------------------------- wheel
const N = LEVELS.length, SEG = Math.PI * 2 / N;
let wheelRot = -Math.PI / 2 - SEG * .5, wheelWin = -1;

function drawWheel() {
  const s = wcv.width, c = s / 2, R = c - 26;
  wctx.clearRect(0, 0, s, s);
  wctx.save(); wctx.translate(c, c);
  // outer rim with bulbs
  wctx.beginPath(); wctx.arc(0, 0, R + 18, 0, 7); wctx.fillStyle = '#2a2140'; wctx.fill();
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2, on = ((i + Math.floor(clock / 8)) % 2) === 0;
    wctx.beginPath(); wctx.arc(Math.cos(a) * (R + 9), Math.sin(a) * (R + 9), 4.5, 0, 7);

  }

    wctx.fillStyle = LEVELS[i].wheel; wctx.fill();

    wctx.lineWidth = 3; wctx.strokeStyle = 'rgba(0,0,0,.35)'; wctx.stroke();

    wctx.fillText(LEVELS[i].icon, R - 14, 0);
    wctx.font = '800 21px system-ui,sans-serif'; wctx.lineWidth = 5; wctx.strokeStyle = 'rgba(0,0,0,.55)';
    wctx.strokeText(LEVELS[i].name.toUpperCase(), R - 62, 1); wctx.fillText(LEVELS[i].name.toUpperCase(), R - 62, 1);
    wctx.restore();

    const a0 = wheelRot + wheelWin * SEG;
    wctx.beginPath(); wctx.moveTo(0, 0); wctx.arc(0, 0, R - 2, a0, a0 + SEG); wctx.closePath();
    wctx.lineWidth = 7; wctx.strokeStyle = '#fff'; wctx.stroke();

  wctx.lineWidth = 6; wctx.strokeStyle = '#2a2140'; wctx.stroke();
  wctx.fillStyle = '#2a2140'; wctx.font = '800 22px system-ui'; wctx.textAlign = 'center'; wctx.textBaseline = 'middle'; wctx.fillText('SPIN', 0, 1);
  wctx.restore();

  wctx.beginPath(); wctx.moveTo(c - 20, 2); wctx.lineTo(c + 20, 2); wctx.lineTo(c, 50); wctx.closePath();
  wctx.fillStyle = '#ff2e4d'; wctx.fill(); wctx.lineWidth = 5; wctx.strokeStyle = '#fff'; wctx.stroke();
}

const ease = t => 1 - Math.pow(1 - t, 4);
function spinWheel() {
  if (state === 'spinning') return;
  state = 'spinning'; $btn.disabled = true; $shopBtn.disabled = true; $result.textContent = ''; wheelWin = -1;
  beep(300, .15, 'sawtooth', .04, 400);
  const idx = Math.floor(Math.random() * N);
  const jitter = (Math.random() - .5) * SEG * .7;
  const finalBase = -Math.PI / 2 - (idx + .5) * SEG + jitter;
  const TAU = Math.PI * 2;
  const start = wheelRot;
  const delta = (((finalBase - start) % TAU) + TAU) % TAU + TAU * (5 + Math.floor(Math.random() * 3));
  const dur = 4200, t0 = performance.now();
  let lastTick = Math.floor(start / SEG);
  (function step(now) {
    const t = Math.min(1, (now - t0) / dur);
    wheelRot = start + delta * ease(t);
    const tick = Math.floor(wheelRot / SEG);
    if (tick !== lastTick) { lastTick = tick; beep(700 + (t * 200), .03, 'triangle', .05); }
    if (t < 1) return requestAnimationFrame(step);
    wheelWin = idx; levelIdx = idx; level = LEVELS[idx];
    state = 'landing';
    $result.textContent = level.icon + ' ' + level.name;
    $text.textContent = level.text;
    beep(520, .12, 'square', .06); setTimeout(() => beep(780, .2, 'square', .06), 120);
    setTimeout(startLevel, 1700);
  })(t0);
}

// ---------------------------------------------------------------- gems
function gemArc(x0, w, topY) {
  const n = 5;
  for (let i = 0; i < n; i++) gems.push({x:x0 - 8 + i * (w + 36) / (n - 1), y:Math.max(GROUND - 126, topY - 22 - Math.sin(Math.PI * i / (n - 1)) * 30), t:Math.random() * 9, v:1});
}
function gemRow() {
  const r = Math.random(), x0 = W + 40, big = Math.random() < .12;
  if (r < .4) for (let i = 0; i < 6; i++) gems.push({x:x0 + i * 34, y:GROUND - 24, t:i, v:1});
  else if (r < .7) for (let i = 0; i < 5; i++) gems.push({x:x0 + i * 34, y:GROUND - 96, t:i, v:1});
  else for (let i = 0; i < 8; i++) gems.push({x:x0 + i * 32, y:GROUND - 66 - Math.sin(i * .8) * 34, t:i, v:1});
  if (big) { const g = gems[gems.length - 1 - Math.floor(Math.random() * 4)]; g.v = 5; }
}

// A diamond may never sit inside an obstacle. Ground obstacles lift it onto an arc above their top (only if the
// jump can still reach it); anything else (air enemies, meteors, too-tall spires) removes it.
const GEM_MIN_Y = GROUND - 126;
function keepGemClear(g) {
  if (g.got || boss) return;
  for (let pass = 0; pass < 3; pass++) {
    const o = obstacles.find(o => !o.dead && g.x + 10 > o.x - 4 && g.x - 10 < o.x + o.w + 4 && g.y + 10 > o.y - o.h - 4 && g.y - 10 < o.y + 4);
    if (!o) return;
    const ny = o.y - o.h - 14;
    if ((o.kind === 'air' || o.kind === 'meteor' || o.kind === 'hopper') || ny < GEM_MIN_Y) { g.got = true; g.silent = true; return; }
    g.y = ny;
  }
  g.got = true; g.silent = true;
}

    hudTxt(player.flyT > 0 ? '🚀 ' + Math.ceil(player.flyT / 60) + 's' : ready ? '🚀 PINCH / G TO FLY' : '🚀 ' + Math.ceil(player.flyCD / 60) + 's', 174, fy - 3, 13);
  }
  if (toast > 0) { toast -= .5; ctx.globalAlpha = Math.min(1, toast / 20); hudTxt(toastMsg.toUpperCase(), 410, 82, 18); ctx.globalAlpha = 1; }
  if (boss && !boss.dead) {
    for (let i = 0; i < CHIP_MAX; i++) { ctx.beginPath(); ctx.arc(W - 22 - i * 15, 134, 5, 0, 7); ctx.fillStyle = i < chip ? '#ff9d2e' : 'rgba(0,0,0,.45)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke(); }
    hudTxt('CHIP', W - 18, 144, 12, 'right');
  }
  if (boss) {
    const bx = W / 2 - 170, f = Math.max(0, boss.hp / boss.max);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx - 3, 10, 346, 20); ctx.fillStyle = f > .5 ? '#ff4d4d' : '#ff9d2e'; ctx.fillRect(bx, 13, 340 * f, 14);
    hudTxt(boss.d.name, W / 2, 33, 16, 'center');
  }
  if (bossBanner > 0) { ctx.globalAlpha = Math.min(1, bossBanner / 30) * (Math.floor(bossBanner / 8) % 2 ? .7 : 1); hudTxt('⚠ BOSS: ' + boss.d.name + ' ⚠', W / 2, 120, 38, 'center'); hudTxt('ARROWS / A D = MOVE', W / 2, 168, 20, 'center'); ctx.globalAlpha = 1; }
  if (state === 'play' && levelTime < 90 && !boss) { ctx.globalAlpha = 1 - levelTime / 90; hudTxt(level.text, W / 2, 110, 30, 'center'); ctx.globalAlpha = 1; }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(2.5, (now - last) / 16.667); last = now; clock += dt;
  scroll += (state === 'play' || state === 'over' ? (state === 'over' || boss ? 0 : speed) : 1.2) * dt;
  if (state === 'play') update(dt);
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  render();
  if (!overlay.classList.contains('hidden')) drawWheel();
  requestAnimationFrame(frame);
}

showOverlay('WHEEL RUNNER', 'Run forever. Dodge everything. Spin the wheel to decide which level you face.', 'SPIN THE WHEEL');
requestAnimationFrame(frame);
// test hook
window.__game = {get state(){return state}, get score(){return score}, get level(){return level.name}, spin:primary, jump, startBoss:(i, t) => { state = 'play'; overlay.classList.add('hidden'); startBoss(i, t || 0); }, get boss(){return boss}, setBossHp:n => { if (boss) boss.hp = n; }, godMode:() => { player.inv = 1e9; }, get armor(){return armor}, get hero(){return save.hero}, get minis(){return minis}, get chip(){return chip}, spawnMini:() => spawnMini(), get p(){return player}, get pow(){return pow}, set pow(v){pow=v}, get obstacles(){return obstacles}, get gems(){return gems}, startFly, set hero(v){save.hero=v}, get supers(){return supers}};
})();
