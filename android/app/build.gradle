plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wheelrunner.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wheelrunner.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game itself is the repo-root index.html; copy it into the APK's assets
    // so the web version and the app never drift apart.
    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('generated/game')
    }
}

tasks.register('copyGame', Copy) {
    from(rootProject.file('../index.html'))
    into(layout.buildDirectory.dir('generated/game'))
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'copyGame'
}
